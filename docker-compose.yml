services:
  postgres:
    image: postgres:16
    container_name: planion_backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: planion
      POSTGRES_USER: user
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: